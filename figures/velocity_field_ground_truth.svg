<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #8b1d1d; }
      .subtitle { font: 500 17px Arial, Helvetica, sans-serif; fill: #475569; }
      .label { font: 700 22px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 500 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .formula { font: italic 24px Georgia, "Times New Roman", serif; fill: #111827; }
      .formulaSmall { font: italic 18px Georgia, "Times New Roman", serif; fill: #111827; }
      .panel { fill: #ffffff; stroke: #d6d3c8; stroke-width: 2; rx: 24; }
      .clean { fill: #e5e7eb; stroke: #334155; stroke-width: 2.4; rx: 16; }
      .cond { fill: #e8f3ff; stroke: #2563a0; stroke-width: 2.4; rx: 16; }
      .noiseBox { fill: #f8fafc; stroke: #64748b; stroke-width: 2.4; rx: 16; }
      .mix { fill: #fff2df; stroke: #c56a19; stroke-width: 2.5; rx: 18; }
      .truth { fill: #ecfdf5; stroke: #047857; stroke-width: 2.7; rx: 20; }
      .minus { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .plus { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .arrow { stroke: #263238; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .blueArrow { stroke: #2563a0; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .orangeArrow { stroke: #c56a19; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .greenArrow { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .redArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .dash { stroke-dasharray: 8 8; }
      .pixelA { fill: #f8fafc; }
      .pixelB { fill: #cbd5e1; }
      .pixelC { fill: #64748b; }
      .stack1 { fill: #cfe8ff; stroke: #2563a0; stroke-width: 1.8; }
      .stack2 { fill: #b8dcff; stroke: #2563a0; stroke-width: 1.8; }
      .particle { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .vec { stroke: #047857; stroke-width: 4; marker-end: url(#arrowGreen); }
    </style>

    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2563a0"/>
    </marker>
    <marker id="arrowOrange" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#c56a19"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#047857"/>
    </marker>
    <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#dc2626"/>
    </marker>

    <linearGradient id="pathGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="0.55" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect class="bg" width="1500" height="820"/>
  <text class="title" x="58" y="68">Ground-Truth Velocity Field Construction</text>
  <text class="subtitle" x="60" y="102">The target velocity is analytically computed from the clean image, degraded measurement, and injected Gaussian noise.</text>

  <rect class="panel" x="48" y="140" width="1404" height="610"/>

  <!-- Clean image -->
  <g filter="url(#shadow)">
    <rect class="clean" x="92" y="230" width="190" height="155"/>
    <text class="label" x="132" y="265">Target x</text>
    <g transform="translate(140 285)">
      <rect x="0" y="0" width="96" height="64" fill="#ffffff" stroke="#334155" stroke-width="1.5" rx="4"/>
      <rect class="pixelA" x="8" y="8" width="16" height="16"/>
      <rect class="pixelB" x="24" y="8" width="16" height="16"/>
      <rect class="pixelA" x="40" y="8" width="16" height="16"/>
      <rect class="pixelC" x="56" y="8" width="16" height="16"/>
      <rect class="pixelB" x="72" y="8" width="16" height="16"/>
      <rect class="pixelB" x="8" y="24" width="16" height="16"/>
      <rect class="pixelA" x="24" y="24" width="16" height="16"/>
      <rect class="pixelC" x="40" y="24" width="16" height="16"/>
      <rect class="pixelB" x="56" y="24" width="16" height="16"/>
      <rect class="pixelA" x="72" y="24" width="16" height="16"/>
      <rect class="pixelA" x="8" y="40" width="16" height="16"/>
      <rect class="pixelC" x="24" y="40" width="16" height="16"/>
      <rect class="pixelB" x="40" y="40" width="16" height="16"/>
      <rect class="pixelA" x="56" y="40" width="16" height="16"/>
      <rect class="pixelB" x="72" y="40" width="16" height="16"/>
    </g>
    <text class="small" x="112" y="365">supervision, not input</text>
  </g>

  <!-- Degraded stack -->
  <g filter="url(#shadow)">
    <rect class="cond" x="92" y="450" width="190" height="155"/>
    <text class="label" x="128" y="485">Condition c</text>
    <g transform="translate(126 510)">
      <polygon class="stack1" points="0,24 75,0 125,31 48,58"/>
      <polygon class="stack2" points="12,39 87,15 137,46 60,73"/>
      <polygon class="stack1" points="24,54 99,30 149,61 72,88"/>
      <polygon class="stack2" points="36,69 111,45 161,76 84,103"/>
    </g>
    <text class="small" x="132" y="585">9-channel input</text>
  </g>

  <!-- Noise -->
  <g filter="url(#shadow)">
    <rect class="noiseBox" x="350" y="450" width="190" height="155"/>
    <text class="label" x="385" y="485">Noise eps</text>
    <g transform="translate(395 515)">
      <circle class="particle" cx="12" cy="28" r="9"/>
      <circle class="particle" cx="50" cy="15" r="6"/>
      <circle class="particle" cx="84" cy="38" r="8"/>
      <circle class="particle" cx="112" cy="12" r="5"/>
      <circle class="particle" cx="28" cy="72" r="7"/>
      <circle class="particle" cx="74" cy="75" r="6"/>
      <circle class="particle" cx="122" cy="65" r="9"/>
    </g>
    <text class="small" x="382" y="585">Gaussian perturbation</text>
  </g>

  <!-- Coefficients -->
  <g filter="url(#shadow)">
    <rect class="mix" x="350" y="230" width="190" height="155"/>
    <text class="label" x="385" y="265">Weights</text>
    <g transform="translate(382 295)">
      <rect x="0" y="22" width="24" height="58" fill="#bfdbfe" stroke="#2563a0" rx="5"/>
      <rect x="42" y="0" width="24" height="80" fill="#fbbf24" stroke="#c56a19" rx="5"/>
      <rect x="84" y="45" width="24" height="35" fill="#fecaca" stroke="#dc2626" rx="5"/>
    </g>
    <text class="formulaSmall" x="390" y="370">t, a, b</text>
  </g>

  <!-- Flow state construction -->
  <g filter="url(#shadow)">
    <rect class="mix" x="630" y="210" width="320" height="220"/>
    <text class="label" x="708" y="248">Flow state z<tspan baseline-shift="sub">t</tspan></text>
    <g transform="translate(675 290)">
      <path d="M18 92 C82 10 176 8 250 56" stroke="url(#pathGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="18" cy="92" r="24" fill="#e5e7eb" stroke="#334155" stroke-width="2"/>
      <circle cx="135" cy="34" r="24" fill="#fef3c7" stroke="#c56a19" stroke-width="2"/>
      <circle cx="250" cy="56" r="24" fill="#bfdbfe" stroke="#2563a0" stroke-width="2"/>
      <text class="small" x="7" y="135">x</text>
      <text class="small" x="123" y="0">z<tspan baseline-shift="sub">t</tspan></text>
      <text class="small" x="242" y="103">c</text>
      <line class="vec" x1="110" y1="58" x2="164" y2="42"/>
    </g>
    <text class="formulaSmall" x="660" y="402">z<tspan baseline-shift="sub">t</tspan> = (1 - t)x + (1 - a)tc + bt eps</text>
  </g>

  <path class="arrow" d="M282 308 L350 308"/>
  <path class="blueArrow" d="M282 528 L630 350"/>
  <path class="orangeArrow" d="M540 308 L630 320"/>
  <path class="arrow dash" d="M540 528 C585 515 595 430 630 385"/>

  <!-- Derivative / velocity truth -->
  <g filter="url(#shadow)">
    <rect class="truth" x="1035" y="215" width="330" height="390"/>
    <text class="label" x="1097" y="255">Velocity ground truth v</text>
    <g transform="translate(1085 300)">
      <circle cx="45" cy="88" r="28" fill="#e5e7eb" stroke="#334155" stroke-width="2"/>
      <circle cx="220" cy="88" r="28" fill="#bfdbfe" stroke="#2563a0" stroke-width="2"/>
      <line class="vec" x1="82" y1="88" x2="178" y2="88"/>
      <text class="small" x="30" y="140">x</text>
      <text class="small" x="210" y="140">c</text>
    </g>
    <g transform="translate(1088 465)">
      <circle class="plus" cx="22" cy="24" r="20"/>
      <text class="label" x="14" y="32">+</text>
      <text class="formulaSmall" x="55" y="31">(1 - a)c</text>
      <circle class="minus" cx="22" cy="74" r="20"/>
      <text class="label" x="15" y="82">-</text>
      <text class="formulaSmall" x="55" y="81">x</text>
      <circle class="plus" cx="180" cy="74" r="20"/>
      <text class="label" x="172" y="82">+</text>
      <text class="formulaSmall" x="212" y="81">b eps</text>
    </g>
    <text class="formula" x="1087" y="580">v = (1 - a)c - x + b eps</text>
  </g>

  <path class="greenArrow" d="M950 322 C980 322 1000 305 1035 305"/>
  <path class="greenArrow" d="M950 390 C985 430 1005 510 1035 525"/>

  <!-- Target supervision -->
  <g filter="url(#shadow)">
    <rect class="truth" x="665" y="530" width="255" height="120"/>
    <text class="label" x="703" y="568">Supervision</text>
    <text class="formulaSmall" x="695" y="606">model output u -> v</text>
    <line class="vec" x1="715" y1="628" x2="865" y2="628"/>
  </g>
  <path class="greenArrow dash" d="M1035 565 C1000 625 960 640 920 625"/>

  <text class="subtitle" x="65" y="790">Here a is the condition coefficient, b is the noise coefficient, and eps is sampled Gaussian noise. The velocity field is the analytic derivative of the constructed mean-flow path.</text>
</svg>
