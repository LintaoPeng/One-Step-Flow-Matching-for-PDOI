<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #8b1d1d; }
      .caption { font: 500 17px Arial, Helvetica, sans-serif; fill: #475569; }
      .tag { font: 700 24px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 500 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .formula { font: italic 18px Georgia, 'Times New Roman', serif; fill: #111827; }
      .panel { fill: #ffffff; stroke: #d6d3c8; stroke-width: 2; rx: 24; }
      .inputBox { fill: #e8f3ff; stroke: #2563a0; stroke-width: 2.4; rx: 16; }
      .orangeBox { fill: #fff2df; stroke: #c56a19; stroke-width: 2.4; rx: 16; }
      .blueBox { fill: #dbeafe; stroke: #1d4e89; stroke-width: 2.5; rx: 18; }
      .redBox { fill: #ffe4e6; stroke: #9f1239; stroke-width: 2.4; rx: 16; }
      .greenBox { fill: #ecfdf5; stroke: #047857; stroke-width: 2.4; rx: 16; }
      .arrow { stroke: #263238; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .blueArrow { stroke: #2563a0; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .orangeArrow { stroke: #c56a19; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .redArrow { stroke: #9f1239; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .greenArrow { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .thin { stroke-width: 2; }
      .dash { stroke-dasharray: 8 8; }
      .layer { fill: #cfe8ff; stroke: #2563a0; stroke-width: 1.8; }
      .layer2 { fill: #b8dcff; stroke: #2563a0; stroke-width: 1.8; }
      .gtPixel1 { fill: #e5e7eb; }
      .gtPixel2 { fill: #9ca3af; }
      .gtPixel3 { fill: #4b5563; }
      .unetDark { fill: #2f6fa8; stroke: #164b78; stroke-width: 2.2; }
      .unetMid { fill: #77addd; stroke: #164b78; stroke-width: 2.2; }
      .unetLight { fill: #a8cdef; stroke: #164b78; stroke-width: 2.2; }
      .noise { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; opacity: .85; }
    </style>

    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2563a0"/>
    </marker>
    <marker id="arrowOrange" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#c56a19"/>
    </marker>
    <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#9f1239"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#047857"/>
    </marker>

    <linearGradient id="flowGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="0.48" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c7f9e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect class="bg" width="1800" height="960"/>
  <text class="title" x="68" y="76">MeanFlow-UIE Algorithm Flowchart</text>
  <text class="caption" x="70" y="110">Visual overview of training and GT-free inference for 9-channel underwater image restoration.</text>

  <rect class="panel" x="55" y="150" width="1690" height="520"/>
  <rect class="panel" x="55" y="710" width="1690" height="170"/>
  <text class="tag" x="88" y="192">Training</text>
  <text class="tag" x="88" y="753">Inference without GT</text>

  <!-- Input stack -->
  <g filter="url(#shadow)">
    <rect class="inputBox" x="92" y="235" width="220" height="180"/>
    <text class="label" x="137" y="270">Measurement c</text>
    <g transform="translate(143 296)">
      <polygon class="layer" points="0,24 84,0 134,31 48,58"/>
      <polygon class="layer2" points="12,39 96,15 146,46 60,73"/>
      <polygon class="layer" points="24,54 108,30 158,61 72,88"/>
      <polygon class="layer2" points="36,69 120,45 170,76 84,103"/>
      <line x1="10" y1="29" x2="45" y2="48" stroke="#2563a0" stroke-width="1"/>
      <line x1="42" y1="19" x2="82" y2="41" stroke="#2563a0" stroke-width="1"/>
      <line x1="76" y1="10" x2="116" y2="34" stroke="#2563a0" stroke-width="1"/>
    </g>
    <text class="small" x="153" y="390">9 channels</text>
  </g>

  <!-- Supervision target thumbnail: not a network input -->
  <g filter="url(#shadow)">
    <rect class="redBox" x="620" y="555" width="330" height="100"/>
    <text class="label" x="652" y="590">Target x</text>
    <text class="small" x="652" y="620">supervision only</text>
    <g transform="translate(805 574) scale(.82)">
      <rect x="0" y="0" width="96" height="64" fill="#f8fafc" stroke="#334155" stroke-width="1.6" rx="4"/>
      <rect class="gtPixel1" x="8" y="8" width="16" height="16"/>
      <rect class="gtPixel2" x="24" y="8" width="16" height="16"/>
      <rect class="gtPixel1" x="40" y="8" width="16" height="16"/>
      <rect class="gtPixel3" x="56" y="8" width="16" height="16"/>
      <rect class="gtPixel1" x="72" y="8" width="16" height="16"/>
      <rect class="gtPixel2" x="8" y="24" width="16" height="16"/>
      <rect class="gtPixel1" x="24" y="24" width="16" height="16"/>
      <rect class="gtPixel3" x="40" y="24" width="16" height="16"/>
      <rect class="gtPixel2" x="56" y="24" width="16" height="16"/>
      <rect class="gtPixel1" x="72" y="24" width="16" height="16"/>
      <rect class="gtPixel1" x="8" y="40" width="16" height="16"/>
      <rect class="gtPixel3" x="24" y="40" width="16" height="16"/>
      <rect class="gtPixel2" x="40" y="40" width="16" height="16"/>
      <rect class="gtPixel1" x="56" y="40" width="16" height="16"/>
      <rect class="gtPixel2" x="72" y="40" width="16" height="16"/>
    </g>
  </g>

  <!-- Preprocess icon -->
  <g filter="url(#shadow)">
    <rect class="orangeBox" x="380" y="350" width="180" height="120"/>
    <text class="label" x="401" y="386">Normalize c</text>
    <g transform="translate(425 410)">
      <rect x="0" y="22" width="20" height="40" fill="#93c5fd" stroke="#2563a0"/>
      <rect x="32" y="10" width="20" height="52" fill="#60a5fa" stroke="#2563a0"/>
      <rect x="64" y="0" width="20" height="62" fill="#2563eb" stroke="#2563a0"/>
      <line x1="-4" y1="63" x2="96" y2="63" stroke="#334155" stroke-width="2"/>
    </g>
  </g>

  <path class="blueArrow" d="M312 325 C335 325 350 370 380 390"/>

  <!-- Mean-flow visual -->
  <g filter="url(#shadow)">
    <rect class="orangeBox" x="630" y="245" width="310" height="285"/>
    <text class="label" x="703" y="282">Mean-flow Path</text>
    <g transform="translate(665 315)">
      <path d="M20 135 C80 30 175 25 250 70" stroke="#c56a19" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="135" r="28" fill="#d1d5db" stroke="#334155" stroke-width="2"/>
      <circle cx="135" cy="58" r="24" fill="url(#flowGrad)" stroke="#c56a19" stroke-width="2"/>
      <circle cx="250" cy="70" r="28" fill="#bfdbfe" stroke="#2563a0" stroke-width="2"/>
      <text class="small" x="4" y="185">x</text>
      <text class="small" x="122" y="22">z<tspan baseline-shift="sub">t</tspan></text>
      <text class="small" x="240" y="120">c</text>
      <g transform="translate(108 100)">
        <circle class="noise" cx="0" cy="0" r="7"/>
        <circle class="noise" cx="24" cy="-10" r="5"/>
        <circle class="noise" cx="45" cy="2" r="6"/>
        <circle class="noise" cx="66" cy="-14" r="4"/>
      </g>
    </g>
    <text class="formula" x="665" y="500">z<tspan baseline-shift="sub">t</tspan> = (1 - t)x + (1 - a)tc + bt eps</text>
  </g>

  <path class="orangeArrow" d="M560 410 L630 410"/>
  <path class="redArrow dash thin" d="M785 555 C785 540 785 535 785 530"/>
  <path class="redArrow dash thin" d="M950 605 C1170 615 1510 570 1640 453"/>

  <!-- Conditional U-Net -->
  <g filter="url(#shadow)">
    <rect class="blueBox" x="1010" y="225" width="360" height="330"/>
    <text class="label" x="1082" y="262">Conditional U-Net</text>
    <g transform="translate(1045 310)">
      <polygon class="unetDark" points="0,70 45,40 45,190 0,160"/>
      <polygon class="unetMid" points="58,90 98,65 98,165 58,145"/>
      <polygon class="unetLight" points="110,110 150,90 150,145 110,130"/>
      <rect class="unetLight" x="166" y="112" width="58" height="34" rx="5"/>
      <polygon class="unetLight" points="240,90 280,65 280,165 240,145"/>
      <polygon class="unetDark" points="292,40 335,10 335,220 292,190"/>
      <path d="M45 75 C100 15 215 15 292 55" stroke="#164b78" stroke-width="3" fill="none"/>
      <path d="M45 155 C115 210 220 210 292 172" stroke="#164b78" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(1062 505)">
      <rect x="0" y="0" width="110" height="32" fill="#eff6ff" stroke="#2563a0" rx="16"/>
      <text class="small" x="22" y="22">t, r</text>
      <rect x="145" y="0" width="150" height="32" fill="#fff7ed" stroke="#c56a19" rx="16"/>
      <text class="small" x="178" y="22">condition c</text>
    </g>
  </g>

  <path class="blueArrow" d="M940 390 L1010 390"/>

  <!-- Predicted velocity icon -->
  <g filter="url(#shadow)">
    <rect class="blueBox" x="1430" y="270" width="150" height="95"/>
    <path d="M1462 330 C1490 285 1530 285 1550 330" stroke="#2563a0" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text class="label" x="1474" y="342">u</text>
  </g>
  <path class="blueArrow" d="M1370 390 C1390 390 1405 320 1430 320"/>

  <!-- JVP icon and loss -->
  <g filter="url(#shadow)">
    <rect class="redBox" x="1430" y="420" width="150" height="95"/>
    <polygon points="1462,485 1462,447 1500,466" fill="#fda4af" stroke="#9f1239" stroke-width="2"/>
    <line x1="1508" y1="466" x2="1548" y2="466" stroke="#9f1239" stroke-width="3"/>
    <text class="label" x="1479" y="446">JVP</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1640" cy="390" r="63" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/>
    <text class="label" x="1615" y="384">Loss</text>
    <text class="small" x="1605" y="410">L2</text>
  </g>
  <path class="redArrow" d="M1580 318 C1615 322 1635 340 1640 327"/>
  <path class="redArrow" d="M1580 468 C1620 460 1640 440 1640 453"/>
  <text class="formula" x="1495" y="588">u* = v - (t - r)u_dot</text>

  <!-- Inference row pictorial -->
  <g filter="url(#shadow)">
    <rect class="greenBox" x="115" y="775" width="165" height="76"/>
    <g transform="translate(145 793) scale(.55)">
      <polygon class="layer" points="0,24 84,0 134,31 48,58"/>
      <polygon class="layer2" points="18,45 102,21 152,52 66,79"/>
    </g>
    <text class="small" x="183" y="837">c only</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="greenBox" x="390" y="775" width="210" height="76"/>
    <circle cx="445" cy="813" r="25" fill="#bfdbfe" stroke="#047857" stroke-width="2"/>
    <g>
      <circle class="noise" cx="500" cy="803" r="6"/>
      <circle class="noise" cx="525" cy="820" r="5"/>
      <circle class="noise" cx="548" cy="803" r="4"/>
    </g>
    <text class="formula" x="480" y="840">z<tspan baseline-shift="sub">1</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect class="greenBox" x="710" y="775" width="220" height="76"/>
    <rect x="745" y="795" width="120" height="36" fill="#dbeafe" stroke="#1d4e89" stroke-width="2" rx="8"/>
    <text class="label" x="767" y="821">EMA</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="greenBox" x="1040" y="775" width="205" height="76"/>
    <text class="formula" x="1087" y="821">x_hat = z<tspan baseline-shift="sub">1</tspan> - u</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="greenBox" x="1370" y="760" width="190" height="105"/>
    <rect x="1415" y="780" width="98" height="64" fill="url(#outputGrad)" stroke="#047857" stroke-width="2" rx="4"/>
    <path d="M1425 833 C1445 795 1478 806 1503 788" stroke="#047857" stroke-width="4" fill="none" opacity=".8"/>
    <text class="small" x="1416" y="858">restored PNG</text>
  </g>

  <path class="greenArrow" d="M280 813 L390 813"/>
  <path class="greenArrow" d="M600 813 L710 813"/>
  <path class="greenArrow" d="M930 813 L1040 813"/>
  <path class="greenArrow" d="M1245 813 L1370 813"/>

  <path class="greenArrow dash thin" d="M1190 555 C1190 670 820 665 820 775"/>
  <text class="small" x="920" y="674">trained weights</text>

  <text class="caption" x="70" y="925">Figure: MeanFlow-UIE learns a velocity field along a conditional path. During training, c is the network condition; x is used only to construct supervision. During inference, only c is required.</text>
</svg>
